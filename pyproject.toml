[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forgebench"
version = "0.9.0"
description = "Adversarial pre-merge QA for coding-agent output."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "ForgeBench", email = "hello@forgebench.dev" }]
dependencies = [
    "pyyaml>=6.0",
]
license = "Apache-2.0"
keywords = [
    "ai-code-review",
    "cli",
    "code-review",
    "developer-tools",
    "quality-assurance",
    "merge-risk",
    "coding-agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control",
]

[project.urls]
Homepage = "https://forgebench.dev"
Documentation = "https://github.com/caissonhq/forgebench#readme"
Repository = "https://github.com/caissonhq/forgebench"
Issues = "https://github.com/caissonhq/forgebench/issues"
Changelog = "https://github.com/caissonhq/forgebench/blob/main/CHANGELOG.md"

[project.scripts]
forgebench = "forgebench.cli:main"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
include = ["forgebench*"]

[tool.setuptools.package-data]
"forgebench.adversaries.prompts" = ["*.md"]