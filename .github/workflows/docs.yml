name: Docs

on:
  push:
    branches: [main]
    paths:
      - "site-docs/**"
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "site-docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mkdocs.yml
      - name: Install MkDocs Material
        run: pip install mkdocs-material
      - name: Build docs site
        run: mkdocs build --strict
      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: forgebench-docs-site
          path: site/
          retention-days: 7

  deploy:
    # Set repository variable PAGES_DEPLOY=true after enabling Pages (Settings → Pages → GitHub Actions).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PAGES_DEPLOY == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: forgebench-docs-site
          path: site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5