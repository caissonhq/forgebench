name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  test:
    name: Test gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: PYTHONDONTWRITEBYTECODE=1 python -m pytest -q
      - run: PYTHONDONTWRITEBYTECODE=1 python -m forgebench calibrate --cases examples/golden_cases

  binary-bundles:
    name: Binary bundle (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Build platform bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python scripts/build_binary_bundle.py --version "$VERSION" --out dist
      - name: Build macOS pkg
        if: runner.os == 'macOS'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BUNDLE=$(ls -d dist/forgebench-${VERSION}-darwin-* | head -1)
          bash packaging/macos/build_pkg.sh "$VERSION" "$BUNDLE" dist
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.os }}
          path: dist/forgebench-*
          retention-days: 30

  build-matrix:
    name: Build wheels (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*
          retention-days: 30

  publish:
    name: Publish release
    needs: [build-matrix, binary-bundles]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: dist-*
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: binary-*
          merge-multiple: true
      - name: Build sdist and universal wheel for PyPI
        run: |
          python -m pip install --upgrade pip build
          python -m build
          ls -la dist/
      - name: Generate SBOM
        run: |
          pip install cyclonedx-bom
          cyclonedx-py environment -o dist/sbom.json
      - name: Generate attestations
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python scripts/generate_attestations.py dist "$VERSION"
      - name: Generate release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python scripts/generate_release_notes.py "$VERSION" > dist/RELEASE_NOTES.md
      - name: Update Homebrew formula template
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SDIST=$(ls dist/forgebench-${VERSION}.tar.gz 2>/dev/null || ls dist/*.tar.gz | head -1)
          SHA=$(sha256sum "$SDIST" | awk '{print $1}')
          sed -e "s/VERSION_PLACEHOLDER/${VERSION}/g" -e "s/SHA256_PLACEHOLDER/${SHA}/g" \
            packaging/homebrew/forgebench.rb > dist/forgebench.rb
      - name: Collect binary release artifacts
        run: |
          mkdir -p dist
          find artifacts -name 'forgebench-*.tar.gz' -exec cp {} dist/ \; 2>/dev/null || true
          find artifacts -name 'forgebench-*.pkg' -exec cp {} dist/ \; 2>/dev/null || true
          ls -la dist/
      - uses: actions/upload-artifact@v7
        with:
          name: forgebench-release-bundle
          path: |
            dist/*
          retention-days: 90
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          body_path: dist/RELEASE_NOTES.md
          generate_release_notes: false