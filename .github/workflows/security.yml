name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and audit tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pip-audit cyclonedx-bom
      - name: Run pip-audit
        run: pip-audit

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build wheel and SBOM
        run: |
          python -m pip install --upgrade pip build cyclonedx-bom
          python -m build
          cyclonedx-py environment -o sbom.json
      - uses: actions/upload-artifact@v7
        with:
          name: forgebench-sbom
          path: sbom.json
          retention-days: 14