name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run tests
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests

      - name: Run calibration
        run: PYTHONDONTWRITEBYTECODE=1 python -m forgebench calibrate --cases examples/golden_cases

  smoke-install:
    name: PyPI wheel smoke (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install built distribution in a clean venv
        run: |
          python -m venv /tmp/forgebench-smoke-venv
          /tmp/forgebench-smoke-venv/bin/pip install --upgrade pip
          /tmp/forgebench-smoke-venv/bin/pip install dist/forgebench-*.whl

      - name: Smoke test installed CLI
        run: |
          /tmp/forgebench-smoke-venv/bin/forgebench --version
          /tmp/forgebench-smoke-venv/bin/forgebench --help
          /tmp/forgebench-smoke-venv/bin/forgebench doctor
          /tmp/forgebench-smoke-venv/bin/python -c "import forgebench; assert forgebench.__version__ == '0.9.0'"
