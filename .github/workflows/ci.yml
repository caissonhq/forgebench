name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: PYTHONDONTWRITEBYTECODE=1 python -m pytest -q

      - name: Run calibration
        run: PYTHONDONTWRITEBYTECODE=1 python -m forgebench calibrate --cases examples/golden_cases

  smoke-install:
    name: PyPI wheel smoke (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install built distribution in a clean venv
        run: |
          python -m venv /tmp/forgebench-smoke-venv
          /tmp/forgebench-smoke-venv/bin/pip install --upgrade pip
          /tmp/forgebench-smoke-venv/bin/pip install dist/forgebench-*.whl

      - name: Smoke test installed CLI
        run: |
          /tmp/forgebench-smoke-venv/bin/forgebench --version
          /tmp/forgebench-smoke-venv/bin/forgebench --help
          /tmp/forgebench-smoke-venv/bin/forgebench doctor
          /tmp/forgebench-smoke-venv/bin/python - <<'PY'
          import re
          from pathlib import Path
          import forgebench
          expected = re.search(
              r'^version\s*=\s*"([^"]+)"',
              Path("pyproject.toml").read_text(encoding="utf-8"),
              re.MULTILINE,
          ).group(1)
          assert forgebench.__version__ == expected, f"{forgebench.__version__} != {expected}"
          PY