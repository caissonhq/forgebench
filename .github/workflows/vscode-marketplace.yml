name: VS Code Marketplace

on:
  workflow_dispatch:
    inputs:
      version:
        description: Extension version to publish
        required: true
        default: "1.2.0"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Install vsce
        run: npm install -g @vscode/vsce
      - name: Build extension
        working-directory: integrations/vscode-forgebench
        run: |
          npm install
          npm run compile
      - name: Package VSIX
        working-directory: integrations/vscode-forgebench
        run: vsce package --out forgebench-${{ inputs.version }}.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: forgebench-vscode-vsix
          path: integrations/vscode-forgebench/forgebench-*.vsix
          retention-days: 30
      - name: Publish to Marketplace
        if: ${{ secrets.VSCE_PAT != '' }}
        working-directory: integrations/vscode-forgebench
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: vsce publish -p "$VSCE_PAT"