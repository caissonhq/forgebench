site_name: ForgeBench
site_description: Adversarial pre-merge QA for coding-agent output
site_url: https://forgebench.dev
repo_url: https://github.com/caissonhq/forgebench
repo_name: caissonhq/forgebench
edit_uri: edit/main/site-docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

nav:
  - Home: index.md
  - Installation: installation.md
  - Install methods: install-methods.md
  - Pricing: pricing.md
  - Quickstart: quickstart.md
  - Presets gallery: presets-gallery.md
  - CLI Reference: cli-reference.md
  - Troubleshooting: troubleshooting.md
  - Onboarding:
      - Demo script: onboarding/demo-script.md
      - New user checklist: onboarding/checklist.md
  - IDE Integrations:
      - VS Code: ide/vscode.md
      - JetBrains: ide/jetbrains.md
  - Enterprise:
      - Init wizard: enterprise/init.md
      - Team policy: enterprise/team-policy.md
      - Pricing & licensing: enterprise/pricing.md
      - Customer onboarding: enterprise/customer-onboarding.md

      - GitHub App listing: github-app-listing.md
      - Design partners: design-partner.md
      - Early access: early-access.md
  - How we iterate: how-we-iterate.md
  - Launch:
      - v1.0 release notes: launch/RELEASE_v1.0.0.md
      - Launch day checklist: launch/LAUNCH_DAY_CHECKLIST.md
      - Final announcements: launch/announcements-final.md
      - Blog announcement: launch/BLOG_ANNOUNCEMENT.md
      - Marketplace status: launch/MARKETPLACE_STATUS.md
      - Announcements (drafts): launch/announcements.md
      - Launch checklist: launch/LAUNCH_EXECUTION_CHECKLIST.md
      - Press one-pager: launch/press-one-pager.md
      - Design partners: design-partner.md
  - API:
      - MCP server: api/mcp.md
      - Report schema: api/report-schema.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

docs_dir: site-docs